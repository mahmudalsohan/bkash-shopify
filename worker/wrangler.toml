name = "bkash-shopify"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Hourly: retry failed Shopify syncs, recover abandoned payments, auto-cancel stale orders
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "bkash-shopify"
database_id = "005721b4-730d-40f9-9a00-291fab4bff12"

# Non-secret config. Secrets are set with `wrangler secret put` (see README).
[vars]
PUBLIC_URL = "https://bkash-shopify.comfiqbd.workers.dev"
SHOPIFY_SHOP = "fab336-57.myshopify.com"
SHOPIFY_CLIENT_ID = "74fab2cd8ddbee9dbb3bbe69117057dc"
SHOPIFY_API_VERSION = "2026-07"
BKASH_GATEWAY_NAME = "bKash"
AUTO_CANCEL_HOURS = "24"
# Sandbox. Switch to https://tokenized.pay.bka.sh/v1.2.0-beta for live.
BKASH_BASE_URL = "https://tokenized.sandbox.bka.sh/v1.2.0-beta"
